codecov:
  branch: main

coverage:
  status:
    project:
      default:
        # Fail the build if the coverage decreases by more than 1%
        threshold: 1%
        # Compare against the coverage of the most recent base commit
        target: auto
    patch:
      default:
        # Added or changed executable lines must remain fully covered.
        target: 100%
        threshold: 0%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
